<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>peel social preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f1115; }
  .card { width: 1280px; height: 640px; display: block; }
</style>
</head>
<body>
<!-- 1280x640 GitHub social preview. Static SVG: no script-built shapes. -->
<svg class="card" viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="peel: take apart every archive under a folder, layer by layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171d"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="peelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b44b"/>
      <stop offset="1" stop-color="#e0782d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Left: nested archive layers, the outer ones opened back like peel. -->
  <g transform="translate(110 120)">
    <!-- outer layer: .zip, flap folded open -->
    <rect x="0" y="0" width="400" height="400" rx="28" fill="none" stroke="#3a4150" stroke-width="3" stroke-dasharray="10 9"/>
    <path d="M 400 0 L 400 120 Q 400 150 370 150 L 250 150 Z" fill="url(#peelEdge)" opacity="0.92"/>
    <text x="24" y="44" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="24" fill="#7d8798">evidence.zip</text>

    <!-- middle layer: .tar.gz, opened -->
    <rect x="50" y="70" width="300" height="300" rx="22" fill="none" stroke="#4b5466" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M 350 70 L 350 160 Q 350 182 328 182 L 238 182 Z" fill="url(#peelEdge)" opacity="0.75"/>
    <text x="72" y="110" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22" fill="#8c96a7">logs.tar.gz</text>

    <!-- core: the files, out in the open -->
    <rect x="100" y="150" width="200" height="190" rx="18" fill="#1b2029" stroke="#f6b44b" stroke-width="3"/>
    <g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="21" fill="#e7ebf2">
      <text x="124" y="200">report.txt</text>
      <text x="124" y="240">notes.txt</text>
      <text x="124" y="280">data.csv</text>
    </g>
    <circle cx="282" cy="168" r="7" fill="#7bd88f"/>
  </g>

  <!-- Right: name and promise. -->
  <g transform="translate(600 0)">
    <text x="0" y="250" font-family="Inter, DejaVu Sans, sans-serif" font-size="128" font-weight="800" fill="#f3f5f9" letter-spacing="-3">peel</text>
    <text x="4" y="320" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="600" fill="#f6b44b">Take apart every archive</text>
    <text x="4" y="364" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="600" fill="#f6b44b">under a folder, layer by layer.</text>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#9aa4b5">
      <text x="4" y="436">Nested and misnamed archives, by content</text>
      <text x="4" y="474">Never prompts. Never touches an original.</text>
      <text x="4" y="512">Rust CLI over 7-Zip, and binwalk on request</text>
    </g>
  </g>
</svg>
</body>
</html>
